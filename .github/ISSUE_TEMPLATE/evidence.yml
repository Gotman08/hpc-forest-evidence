name: Evidence or calculation issue
description: Report a reproducibility problem or a specific unsupported claim.
title: "Evidence: "
body:
  - type: input
    id: revision
    attributes:
      label: Repository commit or release
      description: Include the precise revision you checked.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and observation
      description: Provide the command, Python/OS version, expected result and actual result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Include the public file and row, or a small anonymized example. Remove credentials and private data.
